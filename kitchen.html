<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Crew Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            display: inline-block;
            width: 380px;
            max-width: 95%;
        }

        button {
            background: #00b894;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin: 7px;
            width: 85%;
        }

        button:hover {
            background: #008f72;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #weightValue {
            font-size: 30px;
            font-weight: bold;
            color: #55efc4;
        }

        #weightStatus {
            margin: 10px;
            font-weight: bold;
        }

        #statusBox {
            font-size: 18px;
            color: #74b9ff;
            margin-top: 10px;
            font-weight: bold;
        }

        #alertBox {
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🍽️ Kitchen Control Panel</h2>

    <h3>Tray Weight</h3>

    <div id="weightValue">
        Loading...
    </div>

    <div id="weightStatus">
        Checking...
    </div>


    <h3>Select Table</h3>

    <!-- IMPORTANT:
         Buttons are NOT disabled.
    -->

    <button onclick="sendOrder('Table 1')">
        Send to Table 1
    </button>

    <button onclick="sendOrder('Table 2')">
        Send to Table 2
    </button>

    <button onclick="sendOrder('Table 3')">
        Send to Table 3
    </button>


    <h3>Robot Status</h3>

    <div id="statusBox">
        Loading...
    </div>


    <div id="alertBox"></div>

</div>


<script>

const databaseURL =
    "https://test-5b6ed-default-rtdb.firebaseio.com";


// =====================================================
// SEND ORDER
// =====================================================

async function sendOrder(table) {

    console.log("Selected table:", table);


    // -------------------------------------------------
    // GET CURRENT WEIGHT
    // -------------------------------------------------

    try {

        const response =
            await fetch(
                `${databaseURL}/ROBOT_WEIGHT.json`
            );


        const weight =
            await response.json();


        console.log(
            "Current weight:",
            weight
        );


        // -------------------------------------------------
        // CHECK WEIGHT
        // -------------------------------------------------

        if (
            weight === null ||
            Number(weight) < 50
        ) {

            showAlert(
                "⚠️ Food tray must contain at least 50 g.",
                "#d63031"
            );

            return;
        }


        // -------------------------------------------------
        // SEND COMMAND
        // -------------------------------------------------

        const command =
            `START:${table}`;


        console.log(
            "Sending command:",
            command
        );


        const commandResponse =
            await fetch(
                `${databaseURL}/COMMAND.json`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(command)
                }
            );


        if (!commandResponse.ok) {

            throw new Error(
                "Failed to send command"
            );
        }


        // -------------------------------------------------
        // SUCCESS
        // -------------------------------------------------

        showAlert(
            `✅ Robot sent to ${table}`,
            "#00b894"
        );


        document.getElementById(
            "statusBox"
        ).innerText =
            `Sending robot to ${table}`;


    }

    catch (error) {

        console.error(
            "ERROR:",
            error
        );


        showAlert(
            "❌ Error sending command. Check Firebase connection.",
            "#d63031"
        );
    }
}


// =====================================================
// GET WEIGHT
// =====================================================

async function updateWeight() {

    try {

        const response =
            await fetch(
                `${databaseURL}/ROBOT_WEIGHT.json`
            );


        const weight =
            await response.json();


        const value =
            Number(weight || 0);


        document.getElementById(
            "weightValue"
        ).innerText =
            value.toFixed(1) + " g";


        if (value >= 50) {

            document.getElementById(
                "weightStatus"
            ).innerText =
                "✅ Food detected - Ready";

            document.getElementById(
                "weightStatus"
            ).style.color =
                "#55efc4";

        }

        else {

            document.getElementById(
                "weightStatus"
            ).innerText =
                "⚠️ Less than 50 g";

            document.getElementById(
                "weightStatus"
            ).style.color =
                "#ff7675";
        }

    }

    catch (error) {

        console.error(
            "Weight error:",
            error
        );


        document.getElementById(
            "weightValue"
        ).innerText =
            "Connection Error";
    }
}


// =====================================================
// GET ROBOT STATUS
// =====================================================

async function updateStatus() {

    try {

        const response =
            await fetch(
                `${databaseURL}/ROBOT_STATUS.json`
            );


        const status =
            await response.json();


        if (status) {

            document.getElementById(
                "statusBox"
            ).innerText =
                status;
        }

    }

    catch (error) {

        console.error(
            "Status error:",
            error
        );
    }
}


// =====================================================
// GET ROBOT EVENT
// =====================================================

async function updateEvent() {

    try {

        const response =
            await fetch(
                `${databaseURL}/ROBOT_EVENT.json`
            );


        const event =
            await response.json();


        if (!event) {
            return;
        }


        if (
            event ===
            "OBSTACLE_DETECTED"
        ) {

            showAlert(
                "⚠️ Obstacle detected!",
                "#e17055"
            );
        }


        else if (
            event ===
            "OBSTACLE_TIMEOUT"
        ) {

            showAlert(
                "🚨 Obstacle blocked robot for more than 20 seconds!",
                "#d63031"
            );
        }


        else if (
            event ===
            "ARRIVED_AT_TABLE"
        ) {

            showAlert(
                "✅ Robot arrived at table.",
                "#0984e3"
            );
        }


        else if (
            event ===
            "ORDER_TAKEN"
        ) {

            showAlert(
                "✅ Customer took the food. Robot returning to kitchen.",
                "#00b894"
            );
        }


        else if (
            event ===
            "ARRIVED_KITCHEN"
        ) {

            showAlert(
                "🏠 Robot arrived at kitchen.",
                "#6c5ce7"
            );
        }

    }

    catch (error) {

        console.error(
            "Event error:",
            error
        );
    }
}


// =====================================================
// ALERT
// =====================================================

function showAlert(
    message,
    background
) {

    const alertBox =
        document.getElementById(
            "alertBox"
        );


    alertBox.innerText =
        message;


    alertBox.style.background =
        background;


    alertBox.style.display =
        "block";
}


// =====================================================
// START
// =====================================================

updateWeight();

updateStatus();

updateEvent();


setInterval(
    updateWeight,
    1000
);

setInterval(
    updateStatus,
    1000
);

setInterval(
    updateEvent,
    1000
);

</script>

</body>
</html>
